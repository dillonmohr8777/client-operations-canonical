<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Align HCM Customer Agent">
  <defs>
    <style>
      .bg { fill: #17324D; }
      .bar-a { fill: #F05A28; }
      .bar-b { fill: #FC9121; }
      .dot { fill: #FC9121; }
      .face { fill: #F7F9FB; }
      .eye { fill: #17324D; }
      .accent { fill: #F05A28; }
    </style>
  </defs>
  <!-- Chat-safe rounded tile -->
  <rect class="bg" x="16" y="16" width="480" height="480" rx="112" ry="112"/>

  <!-- Soft robot head panel -->
  <rect class="face" x="118" y="148" width="276" height="230" rx="58" ry="58"/>

  <!-- Antenna using Align ascending-dot motif -->
  <circle class="dot" cx="256" cy="78" r="18"/>
  <rect class="accent" x="248" y="96" width="16" height="52" rx="8"/>

  <!-- Align diagonal twin-bar mark as visor / identity -->
  <g transform="translate(156,188) scale(0.28)">
    <!-- Adapted from Align favicon geometry -->
    <polygon class="bar-a" points="480 600.5 363.4 600.5 0 102 116.6 102 480 600.5"/>
    <polygon fill="#445566" points="637.4 600.5 520.8 600.5 157.4 102 274 102 637.4 600.5"/>
    <circle class="dot" cx="400.9" cy="145.2" r="64.4"/>
    <circle class="dot" cx="535.9" cy="315.3" r="64.4"/>
    <circle class="dot" cx="655.6" cy="482.8" r="64.4"/>
  </g>

  <!-- Friendly robot eyes under the mark area - minimal, not cartoon -->
  <circle class="eye" cx="196" cy="318" r="16"/>
  <circle class="eye" cx="316" cy="318" r="16"/>
  <rect class="accent" x="214" y="348" width="84" height="12" rx="6"/>
</svg>
