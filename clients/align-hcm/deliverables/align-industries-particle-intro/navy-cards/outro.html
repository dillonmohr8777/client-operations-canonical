<style>
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { display: block; width: 1920px; height: 1080px; }
</style>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, FPS = 30;
const TOTAL = 174;                 // matches the source outro so total length is unchanged
const DUR = TOTAL / FPS;           // 5.8s

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
const ramp = (t, a, b) => clamp01((t - a) / (b - a));

// The closing card resolves to the same lockup the intro ends on, so the mark
// reads identically at both ends. The sign-off lines are gone; the URL closes.
const T = {
  logoIn: [0.10, 0.72],
  tagIn:  [0.62, 0.98],
  urlIn:  [1.05, 1.45],
};

// Identical placement to intro.html so the mark does not shift between the ends.
const LOGO_POS = { x: 490, y: 290 };
const TAG_POS  = { x: 482, y: 730 };
const URL_CY   = 880;

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: false });
let plate, logo, tag, url, dust = [];

function loadImage(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('failed to load ' + src));
    i.src = src;
  });
}

async function init() {
  [plate, logo, tag, url] = await Promise.all([
    loadImage('assets/plate.png'),
    loadImage('assets/logo.png'),
    loadImage('assets/tagline.png'),
    loadImage('assets/url_orange.png'),
  ]);

  const rnd = mulberry32(20260826);
  for (let i = 0; i < 220; i++) {
    dust.push({
      x: rnd() * W, y: rnd() * H,
      r: 0.7 + rnd() * 1.9,
      vy: -(3 + rnd() * 9),
      vx: (rnd() - 0.5) * 5,
      a: 0.10 + rnd() * 0.30,
      warm: rnd() < 0.22,
      ph: rnd() * Math.PI * 2,
    });
  }
  window.__ready = true;
  window.__count = dust.length;
}

function drawDust(t) {
  for (const p of dust) {
    const x = (p.x + p.vx * t + W) % W;
    const y = (p.y + p.vy * t + H * 2) % H;
    const tw = 0.55 + 0.45 * Math.sin(p.ph + t * 1.7);
    const a = p.a * tw * clamp01(t / 0.5);
    ctx.fillStyle = p.warm ? `rgba(231,140,90,${a})` : `rgba(200,222,255,${a})`;
    ctx.beginPath();
    ctx.arc(x, y, p.r, 0, 6.2832);
    ctx.fill();
  }
}

function bloom(t) {
  const a = ramp(t, T.logoIn[0], T.logoIn[1]) * 0.5;
  if (a <= 0.004) return;
  const cx = 960, cy = LOGO_POS.y + logo.height / 2;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 640);
  g.addColorStop(0, `rgba(150,190,255,${a * 0.8})`);
  g.addColorStop(0.45, `rgba(70,120,210,${a * 0.45})`);
  g.addColorStop(1, 'rgba(40,80,160,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

window.drawFrame = function (frame) {
  const t = frame / FPS;
  ctx.drawImage(plate, 0, 0, W, H);
  drawDust(t);
  bloom(t);

  // mark, matching the intro's resting position and scale
  const k = ramp(t, T.logoIn[0], T.logoIn[1]);
  if (k > 0.004) {
    const e = easeOutCubic(k);
    const s = 0.965 + 0.035 * e;
    const cx = 960, cy = LOGO_POS.y + logo.height / 2;
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    ctx.translate(-cx, -cy);
    ctx.drawImage(logo, LOGO_POS.x, LOGO_POS.y);
    ctx.restore();
  }

  const tk = ramp(t, T.tagIn[0], T.tagIn[1]);
  if (tk > 0.004) {
    const e = easeOutCubic(tk);
    ctx.save();
    ctx.globalAlpha = e;
    ctx.drawImage(tag, TAG_POS.x, Math.round(TAG_POS.y + (1 - e) * 10));
    ctx.restore();
  }

  const uk = ramp(t, T.urlIn[0], T.urlIn[1]);
  if (uk > 0.004) {
    const e = easeOutCubic(uk);
    ctx.save();
    ctx.globalAlpha = e;
    ctx.drawImage(url, Math.round(960 - url.width / 2),
                  Math.round(URL_CY - url.height / 2 + (1 - e) * 8));
    ctx.restore();
  }

  // orange top rule, matching the deck's chrome
  ctx.fillStyle = 'rgba(231,104,45,0.95)';
  ctx.fillRect(0, 0, W, 5);
  return t;
};

window.__total = TOTAL;
init().catch(e => { window.__err = e.message; console.error(e.message); });
</script>
