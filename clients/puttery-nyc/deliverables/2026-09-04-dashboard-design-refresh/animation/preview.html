<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puttery motion study</title>
    <link rel="stylesheet" href="preview.css" />
  </head>
  <body>
    <main class="stage" aria-label="Puttery motion study">
      <video class="golfer-shot" autoplay muted playsinline preload="auto" aria-label="Front-facing Puttery golfer makes a straight putt">
        <source src="puttery-golfer-shot-02.mp4" type="video/mp4" />
      </video>
      <section class="wordmark-course" aria-label="Puttery logo mini golf course">
        <div class="course-fill" aria-hidden="true"></div>
        <svg class="ball-route" viewBox="0 0 163 40" aria-hidden="true">
          <path id="route" d="M6 26 C23 26 28 18 40 20 S64 27 78 19 S106 13 122 22 S142 29 151 19" />
        </svg>
        <span class="ball" aria-hidden="true"></span>
        <img class="exact-wordmark" src="../assets/puttery-logo.svg" width="163" height="40" alt="Puttery" />
        <span class="y-hole" aria-hidden="true"></span>
      </section>
      <p class="caption">Putt the line. Find the Y.</p>
      <button class="replay" type="button">Replay motion</button>
    </main>
    <script>
      const video = document.querySelector('.golfer-shot');
      const stage = document.querySelector('.stage');
      const replay = document.querySelector('.replay');
      const finish = () => stage.classList.add('logo-active');
      video.addEventListener('ended', finish);
      setTimeout(finish, 4300);
      replay.addEventListener('click', () => {
        stage.classList.remove('logo-active');
        video.currentTime = 0;
        video.play();
        setTimeout(finish, 4300);
      });
    </script>
  </body>
</html>
