<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local design review</title><style>body{margin:0;background:#e2e4df;font:14px system-ui;color:#222}header{padding:10px 20px}iframe{display:block;border:0;margin:0 auto;background:white;height:900px}</style><header id="label"></header><iframe id="view" title="Homepage under review"></iframe><script>const p=new URLSearchParams(location.search),slug=p.get('slug'),width=Number(p.get('width')||1100),part=p.get('part');document.querySelector('#label').textContent=slug+' / '+width+'px / '+(part||'opening');const f=document.querySelector('iframe');f.width=width;f.src='/sites/'+slug+'/';f.onload=async()=>{await f.contentDocument.fonts.ready;if(part){f.contentDocument.querySelector('#'+part)?.scrollIntoView({behavior:'instant',block:'start'})}};</script>
