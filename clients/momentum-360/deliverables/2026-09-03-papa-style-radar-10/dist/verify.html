<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prospect preview batch - verify harness</title>
<style>
  html, body { margin: 0; padding: 0; background: #222; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #f { width: 1440px; height: 900px; border: 0; display: block; background: #fff; }
  #verify-out { position: fixed; left: 0; top: 0; z-index: 9; background: #fff; color: #000;
                font: 11px/1.35 monospace; padding: 6px; margin: 0; max-height: 100vh;
                overflow: auto; white-space: pre; }
  body.shot #verify-out { display: none; }
</style>
</head>
<body>
<!-- Dev-only. The page under test renders in a real 1440x900 iframe so the numbers
     match the desktop spec's capture size whatever the outer pane is doing.
       verify.html?page=/sites/<slug>/&measure   -> measurement pass, prints JSON
       verify.html?page=/&shot&y=3300            -> scaled screenshot at scroll y

     The page HTML is fetched and re-written into the iframe with an error
     collector spliced into <head>, because listeners attached after load()
     miss everything that failed during load. Every asset path in the build is
     root-absolute, so rewriting the document does not disturb resolution. -->
<div id="stage"><iframe id="f" title="page under test"></iframe></div>
<pre id="verify-out">loading...</pre>
<script>
(function () {
  var q = new URLSearchParams(location.search),
      f = document.getElementById('f'),
      stage = document.getElementById('stage'),
      page = q.get('page') || '/';

  var COLLECTOR = '<script>(function(){window.__errs=[];' +
    'addEventListener("error",function(e){window.__errs.push(e.target&&e.target.src||e.target&&e.target.href?' +
    '"resource: "+(e.target.src||e.target.href):"js: "+e.message);},true);' +
    'addEventListener("unhandledrejection",function(e){window.__errs.push("promise: "+e.reason);});' +
    'var ce=console.error;console.error=function(){window.__errs.push("console.error: "+' +
    '[].join.call(arguments," "));return ce.apply(console,arguments);};})();<\/script>';

  fetch(page).then(function (r) { return r.text(); }).then(function (src) {
    var doc = f.contentDocument;
    doc.open();
    /* The harness rewrites the document but the browser still serves the
       stylesheet from cache. A rebuilt site.css read from cache made this
       harness report five failures against a page that was correct, so
       every first-party asset gets a buster. */
    var bust = 'v=' + Date.now();
    src = src.replace(/(\/(?:css|js)\/[a-z]+\.(?:css|js))"/g, '$1?' + bust + '"');
    doc.write(src.replace(/<head>/i, '<head>' + COLLECTOR));
    doc.close();
    f.contentWindow.addEventListener('load', ready);
    if (doc.readyState === 'complete') ready();
  }).catch(function (e) {
    document.getElementById('verify-out').textContent = 'FETCH ERROR: ' + e;
  });

  var done = false;
  function ready() {
    if (done) return;
    done = true;
    if (q.has('shot')) {
      document.body.classList.add('shot');
      var fit = function () { stage.style.transform = 'scale(' + (innerWidth / 1440) + ')'; };
      fit(); addEventListener('resize', fit);
      var y = +(q.get('y') || 0), W = f.contentWindow;
      setTimeout(function () {
        W.document.documentElement.style.scrollBehavior = 'auto';
        W.scrollTo(0, y);
        if (W.ScrollTrigger) W.ScrollTrigger.update();
        setTimeout(function () {
          W.document.getAnimations().forEach(function (a) { try { a.finish(); } catch (e) {} });
          document.title = 'SHOT READY';
        }, 200);
      }, q.get('wait') ? +q.get('wait') : 2500);
      return;
    }
    window.__vw = f.contentWindow;
    var s = document.createElement('script');
    s.src = '/js/verify.js?' + Date.now();
    document.body.appendChild(s);
  }
})();
</script>
</body>
</html>
