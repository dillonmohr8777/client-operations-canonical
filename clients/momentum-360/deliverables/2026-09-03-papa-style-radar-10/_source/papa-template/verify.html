<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PAPA clone - verify harness</title>
<style>
  html, body { margin: 0; padding: 0; background: #222; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #f { width: 1440px; height: 900px; border: 0; display: block; background: #fff; }
  #verify-out { position: fixed; left: 0; top: 0; z-index: 9; background: #fff; color: #000;
                font: 11px/1.35 monospace; padding: 6px; margin: 0; max-height: 100vh;
                overflow: auto; white-space: pre; }
  body.shot #verify-out { display: none; }
</style>
</head>
<body>
<!-- Dev-only harness. The clone is rendered inside a real 1440x900 iframe viewport so the
     measurements match the live spec's capture size regardless of how wide the outer
     browser pane happens to be.
       verify.html?measure          -> run the measurement pass, print JSON
       verify.html?shot&y=3300      -> scale to fit the pane and scroll to y, for screenshots -->
<div id="stage"><iframe id="f" src="index.html" title="clone"></iframe></div>
<pre id="verify-out">loading iframe...</pre>
<script>
(function () {
  var q = new URLSearchParams(location.search),
      f = document.getElementById('f'),
      stage = document.getElementById('stage');

  if (q.has('shot')) {
    document.body.classList.add('shot');
    var fit = function () { stage.style.transform = 'scale(' + (innerWidth / 1440) + ')'; };
    fit(); addEventListener('resize', fit);
    f.addEventListener('load', function () {
      var y = +(q.get('y') || 0);
      setTimeout(function () {
        var W = f.contentWindow;
        W.document.documentElement.style.scrollBehavior = 'auto';
        W.scrollTo(0, y);
        // The pane throttles rAF while the iframe is not painting, which stalls GSAP's
        // ticker and freezes CSS transitions part-way. Force one synchronous scroll
        // evaluation and settle every finite animation so the shot shows the resting state.
        if (W.ScrollTrigger) W.ScrollTrigger.update();
        setTimeout(function () {
          W.document.getAnimations().forEach(function (a) { try { a.finish(); } catch (e) {} });
        }, 150);
      }, q.get('wait') ? +q.get('wait') : 2500);
    });
    return;
  }

  f.addEventListener('load', function () {
    window.__vw = f.contentWindow;
    var s = document.createElement('script');
    s.src = 'js/verify.js';
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
