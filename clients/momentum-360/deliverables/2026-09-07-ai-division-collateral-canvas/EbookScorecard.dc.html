<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Nunito+Sans:wght@400;700;800&amp;display=swap">
  <style>
    body { margin: 0; background: #FBF8F4; }
    a { color: #155E86; } a:hover { color: #3897CC; }
    .row { cursor: pointer; transition: background 120ms cubic-bezier(.2,.7,.2,1), transform 220ms cubic-bezier(.2,.7,.2,1); }
    .row:hover { transform: translateX(4px); }
    .bar { transition: width 500ms cubic-bezier(.16,1,.3,1); }
    @keyframes mRise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .rise { animation: mRise 800ms cubic-bezier(.16,1,.3,1) both; }
    .d1 { animation-delay: 70ms; } .d2 { animation-delay: 140ms; } .d3 { animation-delay: 420ms; }
    @media (prefers-reduced-motion: reduce) { .row, .bar { transition-duration: 1ms; } .rise { animation-duration: 1ms; animation-delay: 0ms; } }
  </style>
</helmet>

<div style="width: 816px; height: 1056px; box-sizing: border-box; padding: 60px 64px 56px; background: #FBF8F4; color: #14181B; font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; gap: 0; overflow: hidden;">

  <div class="rise" style="font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #155E86;">Chapter three · the Philadelphia test</div>
  <div class="rise d1" style="font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif; font-size: 44px; line-height: 1.04; letter-spacing: -0.02em; margin-top: 12px;">Are you in the answer?</div>
  <div class="rise d2" style="font-size: 16px; line-height: 1.5; color: #636465; margin-top: 10px;">Ten yes-or-no questions. Tap the ones that are true for your business today.</div>

  <div style="display: flex; flex-direction: column; gap: 0; margin-top: 24px; border-bottom: 1px solid #DCD6CC;">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="10">
      <div class="row" onClick="{{ item.pick }}" style="display: grid; grid-template-columns: 28px 36px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px 12px; border-top: 1px solid #DCD6CC; background: {{ item.bg }};">
        <div style="width: 26px; height: 26px; box-sizing: border-box; border: 2px solid {{ item.border }}; background: {{ item.boxBg }}; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{ item.checked }}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"></path></svg>
          </sc-if>
        </div>
        <div style="font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif; font-size: 15px; color: {{ item.numColor }};">{{ item.n }}</div>
        <div style="font-size: 14.5px; line-height: 1.4; font-weight: 700; color: #14181B;">{{ item.text }}</div>
      </div>
    </sc-for>
  </div>

  <div class="rise d3" style="margin-top: auto; background: #0E1417; color: #F4F1EC; padding: 22px 28px 24px; box-shadow: 14px 16px 0 rgba(226,113,19,.28); display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 24px; align-items: center;">
    <div style="font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif; font-size: 64px; line-height: 1; color: #E27113;">{{ score }}<span style="font-size: 22px; color: #8A9296;"> / 10</span></div>
    <div>
      <div style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; color: #3897CC;">Your verdict</div>
      <div style="font-size: 22px; font-weight: 800; margin-top: 4px;">{{ verdict }}</div>
      <div style="font-size: 14px; line-height: 1.45; color: #8A9296; margin-top: 6px;">{{ verdictText }}</div>
      <div style="height: 6px; background: #1A2226; margin-top: 14px;"><div class="bar" style="height: 6px; background: #E27113; width: {{ pct }}%;"></div></div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":816,"height":1056}}'>
const ITEMS = [
  "When you ask ChatGPT for the best [your service] in Philadelphia, your business is named.",
  "Your Google Business Profile name, address, phone and hours match your website exactly.",
  "Your site answers the ten questions customers ask most, in plain sentences, one per section.",
  "Every service page carries structured data (FAQ or service schema) that a machine can read.",
  "You have Google reviews from the last thirty days, and every review has a reply.",
  "At least three third-party sites mention your business by name: directories, press, associations.",
  "Your site loads in under three seconds on a phone.",
  "Someone checks monthly which AI engines cite you, and writes the number down.",
  "Your robots file lets AI crawlers in, and you publish an llms.txt.",
  "Your prices, service area and who you are not for are stated on the site."
];
class Component extends DCLogic {
  renderVals() {
    const on = (this.state && this.state.on) || {};
    const items = ITEMS.map((text, i) => {
      const checked = !!on[i];
      return {
        n: String(i + 1).padStart(2, '0'),
        text: text,
        checked: checked,
        bg: checked ? '#F0ECE5' : '#FBF8F4',
        boxBg: checked ? '#155E86' : '#FBF8F4',
        border: checked ? '#155E86' : '#8E8578',
        numColor: checked ? '#155E86' : '#636465',
        pick: () => { const next = Object.assign({}, on); next[i] = !checked; this.setState({ on: next }); }
      };
    });
    const score = items.filter((x) => x.checked).length;
    let verdict = 'Invisible';
    let verdictText = 'AI engines have little to cite yet. Start with fixes one, two and nine in chapter four.';
    if (score >= 8) { verdict = 'Recommended'; verdictText = 'Protect it. Track the number monthly and keep third-party mentions growing.'; }
    else if (score >= 5) { verdict = 'Mentioned'; verdictText = 'You appear, inconsistently. Tracking plus an answer-first page gets you recommended.'; }
    return { items: items, score: score, verdict: verdict, verdictText: verdictText, pct: score * 10 };
  }
}
</script>
</body>
</html>
