<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Nunito+Sans:wght@400;700;800&amp;display=swap">
  <style>
    body { margin: 0; background: #0E1417; }
    a { color: #3897CC; } a:hover { color: #F4F1EC; }
    @keyframes mRise  { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
    @keyframes mFade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes mWipeU { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
    .rise { animation: mRise 800ms cubic-bezier(.16,1,.3,1) both; }
    .fade { animation: mFade 500ms cubic-bezier(.2,.7,.2,1) both; }
    .wipe { animation: mWipeU 800ms cubic-bezier(.85,0,.15,1) both; }
    .d1 { animation-delay: 70ms; } .d2 { animation-delay: 140ms; } .d3 { animation-delay: 210ms; } .d4 { animation-delay: 280ms; } .d5 { animation-delay: 420ms; }
    @media (prefers-reduced-motion: reduce) { .rise, .fade, .wipe { animation-duration: 1ms; animation-delay: 0ms; } }
  </style>
</helmet>

<div style="position: relative; width: 1080px; height: 1080px; overflow: hidden; background: #0E1417; color: #F4F1EC; font-family: 'Nunito Sans', 'Segoe UI', system-ui, sans-serif;">

  <div class="wipe" style="position: absolute; left: 0; right: 0; bottom: 0; height: 168px; background: #E27113;"></div>

  <img class="fade" src="momentum-logo-white.png" alt="Momentum" style="position: absolute; top: 72px; left: 80px; width: 232px; height: 50px; object-fit: contain; object-position: left center;">

  <div class="rise d1" style="position: absolute; top: 236px; left: 80px; font-size: 18px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #3897CC;">Press · Inc. 5000, three consecutive years</div>

  <div style="position: absolute; top: 284px; left: 80px; width: 940px; font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif; font-size: 118px; line-height: 0.94; letter-spacing: -0.02em;">
    <div class="rise d2">Momentum</div>
    <div class="rise d3">launches its</div>
    <div class="rise d4">AI division.</div>
  </div>

  <div class="rise d5" style="position: absolute; top: 700px; left: 80px; width: 760px; font-size: 30px; line-height: 1.4; color: #F4F1EC;">
    Eleven years in Philadelphia. Now building the systems that get small businesses recommended by AI.
  </div>

  <div class="fade d5" style="position: absolute; left: 80px; bottom: 56px; display: flex; justify-content: space-between; align-items: center; width: 920px; color: #14181B;">
    <div style="font-size: 26px; font-weight: 800;">needmomentum.com</div>
    <div style="font-size: 20px; font-weight: 700;">(215) 876-2954</div>
  </div>

</div>
</x-dc>
</body>
</html>
