<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Momentum 360 cinematic end card">
  <title>Momentum 360 end card</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1F35"/>
      <stop offset="55%" stop-color="#14314F"/>
      <stop offset="100%" stop-color="#075CA8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1680" cy="180" r="260" fill="#075CA8" opacity="0.35" filter="url(#soft)"/>
  <circle cx="220" cy="980" r="280" fill="#F2B84B" opacity="0.18" filter="url(#soft)"/>
  <rect x="0" y="0" width="18" height="1080" fill="#F2B84B"/>
  <image href="momentum-360-logo.png" x="780" y="210" width="360" height="360" preserveAspectRatio="xMidYMid meet"/>
  <text x="960" y="680" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">Momentum 360</text>
  <text x="960" y="760" text-anchor="middle" fill="#F2B84B" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Make every space move</text>
  <text x="960" y="860" text-anchor="middle" fill="#B8C5D1" font-family="Arial, Helvetica, sans-serif" font-size="28">needmomentum.com</text>
</svg>
